<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Clone – Sign In</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-bg">

<a href="index.html"><img class="auth-logo" src="amazon_logo.png" alt="Amazon"></a>

<div class="auth-box">
  <h2>Sign in</h2>
  <div class="msg-box error" id="msg"></div>

  <label for="email">Email or mobile phone number</label>
  <input type="email" id="email" placeholder="Enter email" autocomplete="email">

  <label for="password">Password</label>
  <input type="password" id="password" placeholder="At least 6 characters" autocomplete="current-password">

  <button class="auth-btn" id="loginBtn" onclick="login()">Sign in</button>

  <div class="auth-footer">
    By continuing, you agree to Amazon's
    <a href="#">Conditions of Use</a> and <a href="#">Privacy Notice</a>.
  </div>

  <div class="auth-divider">New to Amazon?</div>

  <button class="new-account-btn" onclick="window.location.href='signup.html'">
    Create your Amazon account
  </button>
</div>

<script src="auth.js"></script>
</body>
</html>
